[package]
name = "sniff-cdp"
description = "Raw Chrome DevTools Protocol client over WebSocket"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
tokio = { workspace = true, features = ["process", "rt-multi-thread", "macros", "time", "sync", "io-util", "net"] }
tokio-tungstenite = { version = "0.26", default-features = false, features = ["connect", "handshake"] }
futures-util = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
sniff-core = { path = "../sniff-core" }
