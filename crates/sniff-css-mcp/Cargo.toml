[package]
name = "sniff-css-mcp"
description = "MCP server exposing sniffCSS capture/diff/checks as tools for AI agents"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "sniffCSS-mcp"
path = "src/main.rs"

[dependencies]
sniff-core = { path = "../sniff-core" }
sniff-cdp = { path = "../sniff-cdp" }
sniff-engine = { path = "../sniff-engine" }
sniff-css-diff = { path = "../sniff-css-diff" }
sniff-css-check = { path = "../sniff-css-check" }
rmcp = { version = "3.1.2", features = ["transport-io"] }
schemars = "1"
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
rmcp = { version = "3.1.2", features = ["client"] }
