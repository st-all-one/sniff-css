[package]
name = "sniff-mcp"
description = "MCP server exposing sniff-computed-style and sniff-diff as tools for AI agents"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "sniff-mcp"
path = "src/main.rs"

[dependencies]
sniff-core = { path = "../sniff-core" }
sniff-cdp = { path = "../sniff-cdp" }
sniff-engine = { path = "../sniff-engine" }
sniff-diff = { path = "../sniff-diff" }
sniff-check = { path = "../sniff-check" }
rmcp = { version = "3.1.2", features = ["transport-io"] }
schemars = "1"
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
rmcp = { version = "3.1.2", features = ["client"] }
