# Bancada A/B independente: fora do workspace (o `[workspace]` vazio isola o crate),
# sem dependências externas e sem rede/Chrome. Ver `bench/README.md`.

[package]
name = "sniff-ab-bench"
version = "0.0.0"
edition = "2024"
rust-version = "1.100"
publish = false
description = "Comparação A/B determinística dos verbos offline do sniff"

[workspace]

[[bin]]
name = "sniff-ab-bench"
path = "src/main.rs"

[dependencies]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
