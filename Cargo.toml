[workspace]
resolver = "2"
members = [
    "crates/sniff-core",
    "crates/sniff-cdp",
    "crates/sniff-engine",
    "crates/sniff-css",
    "crates/sniff-css-diff",
    "crates/sniff-css-check",
    "crates/sniff-css-mcp",
]

[workspace.package]
version = "0.3.1"
edition = "2024"
rust-version = "1.88"
license = "CC0-1.0"

[workspace.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "io-util", "net"] }
tokio-tungstenite = "0.26"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"
