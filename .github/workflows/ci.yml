name: CI

# Push em qualquer branch + PRs. O release (binários por plataforma) fica no
# `release.yml`, disparado por tag `v*` — aqui não se compila release.
on:
  push:
    branches: ["**"]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  check:
    name: fmt + clippy + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Versão do workspace coerente com Cargo.lock
        run: |
          set -euo pipefail
          version="$(cargo metadata --no-deps --format-version 1 \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(p["version"] for p in d["packages"] if p["name"] == "sniff-core"))')"
          test "$(grep -c "version = \"${version}\"" Cargo.lock)" -ge 8
          test "$(cargo run -q -p sniff-css --bin sniff -- --json self version \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["data"]["version"])')" = "$version"
      - name: Formatação
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Testes
        run: cargo test --workspace

  supply-chain:
    name: deny + audit + machete + typos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-deny cargo-audit cargo-machete --locked
      - run: cargo deny check
      - run: cargo audit
      - run: cargo machete
      - uses: crate-ci/typos@master

  miri:
    name: miri (núcleo puro, smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - uses: Swatinem/rust-cache@v2
      - run: cargo miri setup
      # Só a suíte `tests/miri_smoke.rs` (segundos): o core é
      # `#![forbid(unsafe_code)]` e a cobertura funcional fica no job `check`.
      - run: cargo miri test -p sniff-core --test miri_smoke
        env:
          MIRIFLAGS: "-Zmiri-disable-isolation"

  fuzz:
    name: fuzz (JSONL + JSON-RPC, smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-fuzz --locked
      - run: cargo fuzz build
      - name: smoke de 30s por alvo
        run: |
          for target in jsonl_decode jsonrpc_decode; do
            cargo fuzz run "$target" -- -max_total_time=30
          done
