# Release workflow
#
# Roda quando uma tag v* é enviada (git push --tags). Para cada arquitetura
# compila os 4 binários (sniffCSS, sniffCSS-diff, sniffCSS-check, sniffCSS-mcp)
# com o profile release (LTO fat, strip, panic=abort), empacota num tarball/zip
# junto com um sha256sums.txt e publica como GitHub Release vinculado à tag.
#
# Depois da publicação, o job `docker` constrói a imagem multi-arch
# (linux/amd64 + linux/arm64) baixando os binários do próprio Release e faz
# push para o Docker Hub (stallonels/sniffcss) com a mesma tag.
#
# Secrets necessários no repositório (Settings → Secrets and variables → Actions):
#   DOCKERHUB_USERNAME  username do Docker Hub
#   DOCKERHUB_TOKEN     token de acesso (crie em https://hub.docker.com/settings/security)
# Configure com: scripts/set-secrets.sh

name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── Binários por arquitetura ──────────────────────────────────────────────
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            cmd: cargo
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            cmd: cross
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            cmd: cargo
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            cmd: cross
          - target: aarch64-apple-darwin
            # Only one macOS binary (Apple Silicon, the current/latest macOS
            # hardware). Intel macs (x86_64-apple-darwin) are not published.
            os: macos-14
            cmd: cargo
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            cmd: cargo
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add target
        run: rustup target add ${{ matrix.target }}

      - name: Install cross (for cross-compiled targets)
        if: matrix.cmd == 'cross'
        uses: taiki-e/install-action@cross

      - name: Build (cross)
        if: matrix.cmd == 'cross'
        run: cross build --release --workspace --bins --target ${{ matrix.target }}

      - name: Build (native/cargo)
        if: matrix.cmd == 'cargo'
        run: cargo build --release --workspace --bins --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          TARGET="${{ matrix.target }}"
          STAGING="staging"
          mkdir -p "$STAGING"
          # macOS lacks sha256sum; shasum -a 256 is the portable alternative.
          if command -v sha256sum >/dev/null 2>&1; then
            SHA="sha256sum"
          else
            SHA="shasum -a 256"
          fi
          if [[ "$TARGET" == *-pc-windows-* ]]; then
            # On Windows/MSYS, `sniffCSS` and `sniffCSS.exe` are the SAME file
            # (MSYS appends .exe), so `mv` would be a no-op error. Copy straight
            # to the .exe names instead.
            cp "target/$TARGET/release/sniffCSS"        "$STAGING/sniffCSS.exe"
            cp "target/$TARGET/release/sniffCSS-diff"   "$STAGING/sniffCSS-diff.exe"
            cp "target/$TARGET/release/sniffCSS-check"  "$STAGING/sniffCSS-check.exe"
            cp "target/$TARGET/release/sniffCSS-mcp"    "$STAGING/sniffCSS-mcp.exe"
            # Windows ships bsdtar; `-a` auto-detects zip by extension.
            ( cd "$STAGING" && tar -a -c -f "../sniff-css-${VERSION}-${TARGET}.zip" . )
            ( cd "$STAGING" && $SHA *.exe ) > "checksums-${TARGET}.sha256"
          else
            cp "target/$TARGET/release/sniffCSS"        "$STAGING/sniffCSS"
            cp "target/$TARGET/release/sniffCSS-diff"   "$STAGING/sniffCSS-diff"
            cp "target/$TARGET/release/sniffCSS-check"  "$STAGING/sniffCSS-check"
            cp "target/$TARGET/release/sniffCSS-mcp"    "$STAGING/sniffCSS-mcp"
            tar -czf "sniff-css-${VERSION}-${TARGET}.tar.gz" -C "$STAGING" \
              sniffCSS sniffCSS-diff sniffCSS-check sniffCSS-mcp
            ( cd "$STAGING" && $SHA sniffCSS sniffCSS-diff sniffCSS-check sniffCSS-mcp ) \
              > "checksums-${TARGET}.sha256"
          fi

      - name: Upload binaries (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: sniff-css-${{ matrix.target }}
          path: |
            sniff-css-*.*
            checksums-*.sha256
          if-no-files-found: error

  # ── GitHub Release com assets + sha256sums.txt ────────────────────────────
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Build sha256sums.txt
        run: |
          cd dist
          for f in sniff-css-*.tar.gz sniff-css-*.zip; do
            [ -f "$f" ] && sha256sum "$f"
          done > sha256sums.txt
          cat sha256sums.txt

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
          generate_release_notes: true

  # ── Imagem Docker multi-arch → Docker Hub ────────────────────────────────
  docker:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=${{ github.ref_name }}
          tags: |
            stallonels/sniffcss:${{ github.ref_name }}
            stallonels/sniffcss:latest
          push: true
