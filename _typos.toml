# typos — correção ortográfica no CI (crate-ci/typos).
#
# O projeto documenta e comenta em pt-BR; o typos usa um dicionário de inglês.
# `extend-words` registra o vocabulário português legítimo (case-insensitive).
# Ao introduzir um termo pt-BR novo que o corretor reprove, acrescente-o aqui.

[files]
extend-exclude = [
    "target/",
    "fuzz/corpus/",
    "fuzz/artifacts/",
    "Cargo.lock",
]

[default]
extend-ignore-re = [
    # hashes/ids e tokens técnicos com dígitos (ex.: fact_01bpivlt)
    "[a-z]+_[0-9a-z]{8}",
    "(?s)```.*?```",
]

